name: Daily Digest

on:
  schedule:
    # 毎朝 6:47 JST (= 21:47 UTC)
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r daily-digest/requirements.txt

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_CITY: ${{ vars.DIGEST_CITY }}
          DIGEST_LAT: ${{ vars.DIGEST_LAT }}
          DIGEST_LON: ${{ vars.DIGEST_LON }}
        run: |
          # 未設定の変数は空文字になるので、空なら既定値を使う
          [ -z "$DIGEST_CITY" ] && unset DIGEST_CITY
          [ -z "$DIGEST_LAT" ] && unset DIGEST_LAT
          [ -z "$DIGEST_LON" ] && unset DIGEST_LON
          python daily-digest/digest.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-digest/latest.md daily-digest/reports
          git diff --cached --quiet || git commit -m "Daily digest $(TZ=Asia/Tokyo date +%F)"
          git push
